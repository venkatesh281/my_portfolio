<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Venkateshwaran</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #f6f4ee;
      color: #121316;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .card {
      max-width: 540px;
      width: 100%;
      background: #ffffff;
      border: 1px solid rgba(18, 19, 22, 0.1);
      border-radius: 1.25rem;
      padding: 3rem 2rem;
      box-shadow: 0 4px 20px rgba(18, 19, 22, 0.04);
    }
    .badge {
      display: inline-block;
      font-family: monospace;
      font-size: 0.75rem;
      font-weight: 700;
      color: #0038ff;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-family: Georgia, serif;
      font-size: 2.25rem;
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 1rem;
      color: #121316;
    }
    p {
      color: #525866;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1.75rem;
      background: #0038ff;
      color: #ffffff;
      text-decoration: none;
      font-family: monospace;
      font-size: 0.82rem;
      font-weight: 700;
      border-radius: 0.75rem;
      transition: background 0.18s ease;
    }
    a.btn:hover {
      background: #002ec7;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">404 // ROUTE NOT FOUND</div>
    <h1>Document Missing.</h1>
    <p>
      The blueprint or specification you requested does not exist at this address. The URL may have changed or the document has been archived.
    </p>
    <a href="/" class="btn">Return to Portfolio Atelier ↘</a>
  </div>
</body>
</html>
